<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }} - Learn with Kabeer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/tailwind_config.js') }}"></script>
    
    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/lessons.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/lessons/lesson_base.css') }}" rel="stylesheet" />
</head>
<body id="lesson-body" class="h-screen overflow-hidden bg-white text-gray-900 font-sans antialiased flex flex-col transition-all duration-500">
    
    <!-- ─── Header (Outside Canvas) ─── -->
    <header class="flex-none bg-white px-8 py-3 flex items-center justify-between z-50 w-full">
        <a href="{{ url_for('course_overview', course_slug=course['slug']) }}" class="nav-btn text-gray-400 hover:text-gray-900">
            <i data-lucide="x" class="h-5 w-5"></i>
        </a>
        
        <div class="flex items-center gap-3 flex-1 justify-center max-w-3xl">
            <button id="back-btn" class="nav-btn text-gray-900">
                <i data-lucide="arrow-left" class="h-6 w-6"></i>
            </button>
            
            <div class="flex-1 max-w-[400px]">
                <div class="h-3 w-full overflow-hidden rounded-full bg-gray-100">
                    <div id="progress-fill" class="h-full rounded-full bg-gradient-to-r from-green-500 to-green-300 transition-all duration-500 ease-out" style="width: 0%;"></div>
                </div>
            </div>

            <button id="next-btn" class="nav-btn text-gray-900" disabled>
                <i data-lucide="arrow-right" class="h-6 w-6"></i>
            </button>
        </div>

        <div class="flex shrink-0 items-center gap-1.5 font-extrabold text-gray-300 relative">
            <span class="text-lg tracking-tight text-gray-800" id="current-xp">{{ current_user['total_xp'] if current_user else 0 }}</span>
            <span id="xp-boost" class="xp-boost-number absolute right-full mr-4 whitespace-nowrap">+5</span>
            <i data-lucide="zap" class="h-5 w-5 text-yellow-400 fill-yellow-400"></i>
        </div>
    </header>

    <!-- The Whole Lesson Canvas -->
    <div id="lesson-canvas" class="flex-1 mx-8 mb-8 bg-white rounded-3xl border-2 border-gray-200 flex flex-col overflow-hidden transition-all duration-500">

        <!-- ─── Main Content Area ─── -->
        <main id="lesson-main" class="flex-1 overflow-y-auto px-12 py-8 flex flex-col items-center">
            <!-- Vertical Centering Wrapper: Centers content if short, starts at top if long -->
            <div class="my-auto w-full max-w-[640px]">
                <div id="slide-viewport" class="w-full">
                    {% block lesson_content %}{% endblock %}
                </div>
            </div>
        </main>

        {% set next_lesson = (lessons | selectattr("number", "equalto", lesson.number + 1) | first) %}

        <!-- ─── Footer ─── -->
        <footer class="flex-none bg-white py-5 px-6 flex justify-center z-50">
            <button id="continue-btn" data-state="continue">
            Continue
        </button>
            <form id="complete-form" action="{{ url_for('complete_lesson', course_slug=course.slug, lesson_number=lesson.number) }}" method="post" class="hidden"></form>
        </footer>

    </div> <!-- End Canvas Wrapper -->

    <script>
        window.LESSON_CONFIG = {
            isGuest: {{ 'true' if not current_user else 'false' }},
            isCompleted: {{ 'true' if current_user and completed_lessons >= lesson["number"] else 'false' }},
            nextUrl: "{{ lesson_url(next_lesson, course['slug']) if next_lesson else url_for('course_overview', course_slug=course['slug']) }}",
            loginUrl: "{{ url_for('login', next=request.path) | safe }}",
            isLastLesson: {{ 'true' if not next_lesson else 'false' }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/xp_animation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lessons/lesson_base.js') }}"></script>
    
    <!-- Prism.js and Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
