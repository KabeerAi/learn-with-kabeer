<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }} - Learn with Kabeer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <style>
        /* Global Reset for Lesson View */
        html { scroll-behavior: smooth; font-feature-settings: "ss03", "cv11"; }
        ::selection { background: #111827; color: #FFFFFF; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 999px; }

        /* Slide animations */
        .slide-enter {
            animation: slideLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .slide-exit-left {
            animation: slideOutLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .slide-enter-right {
            animation: slideRight 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(80px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOutLeft {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(-80px); }
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-80px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* --- FORCED PRISM & CODE STYLES --- */
        /* Minimal Block Styling */
        pre[class*="language-"], 
        .lesson-block pre {
            margin: 0 !important;
            padding: 1.25rem !important;
            background: transparent !important;
            font-size: 0.85rem !important;
            border: none !important;
            border-radius: 0 !important;
            white-space: pre !important;
            word-break: normal !important;
            overflow: auto !important;
            line-height: 1.6 !important;
        }
        
        /* Block Code Text Color (Light for Dark Background) */
        pre[class*="language-"] code,
        .lesson-block pre code {
            color: #E6EDF3 !important;
        }

        /* --- UNIFIED KEYWORD STYLING (Inline Code) --- */
        /* This creates the w3schools style "block word" look for technical terms */
        :not(pre) > code {
            background-color: #F1F1F1 !important;
            color: #111827 !important;
            padding: 2px 8px !important;
            font-size: 0.85em !important;
            border-radius: 6px !important;
            border: 1px solid #E1E1E1 !important;
            font-weight: 700 !important;
            display: inline-block !important;
            line-height: 1.4 !important;
            vertical-align: middle !important;
            margin: 0 2px !important;
            box-shadow: 0 1px 0 0 rgba(0,0,0,0.05) !important;
            font-family: 'JetBrains Mono', monospace !important;
        }

        /* Standard Bold Styling */
        .prose strong,
        .lesson-block strong {
            font-weight: 700 !important;
            color: inherit !important;
        }

        /* Adjust Typography if used */
        .prose pre {
            background-color: #0D1117 !important;
            padding: 0 !important; /* Inner pre handles padding */
        }
        /* Removed .prose code override to allow universal keyword styling */

        /* Custom header nav button */
        .nav-btn {
            height: 48px;
            width: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background-color: #f3f4f6;
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #continue-btn {
            position: relative;
            background-color: #2A2A2A;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 12px 48px;
            font-weight: 700;
            font-size: 1.125rem;
            cursor: pointer;
            box-shadow: 0 6px 0 0 #0f0f0f;
            transition: all 0.1s ease;
            width: min(42vw, 320px);
        }
        #continue-btn:hover {
            background-color: #3a3a3a;
        }
        #continue-btn:active {
            box-shadow: 0 2px 0 0 #0f0f0f;
            transform: translateY(4px);
        }
        #continue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: 0 4px 0 0 #0f0f0f;
        }
        #continue-btn.bg-16A34A {
            background-color: #16A34A;
            box-shadow: 0 6px 0 0 #064e3b;
        }
        #continue-btn.bg-16A34A:hover {
            background-color: #10b981;
        }
        #continue-btn.bg-16A34A:active {
            box-shadow: 0 2px 0 0 #064e3b;
        }

        /* Quiz success/error states for body */
        .lesson-body-success {
            background-color: #f0fdf4 !important;
        }
        .lesson-body-error {
            background-color: #fefce8 !important;
        }
        
        /* Quiz option corner icon styling */
        .quiz-btn {
            position: relative;
            overflow: hidden;
        }
        .quiz-option-corner-icon {
            position: absolute;
            top: -1px;
            right: -1px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 12px 0 12px;
        }
        .quiz-btn.selected-wrong {
            border-color: #9ca3af !important;
            background-color: #f3f4f6 !important;
            color: #9ca3af !important;
        }
        .quiz-btn.selected-correct {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
        }

        /* XP boost animation */
        .xp-boost-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: #1f2937;
            opacity: 0;
            transform: translateY(0) scale(0.5);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .xp-boost-number.show {
            opacity: 1;
            transform: translateY(-60px) scale(1.2);
        }
    </style>
</head>
<body id="lesson-body" class="h-screen overflow-hidden bg-white text-gray-900 font-sans antialiased flex flex-col transition-all duration-500">
    
    <!-- ─── Header (Outside Canvas) ─── -->
    <header class="flex-none bg-white px-8 py-3 flex items-center justify-between z-50 w-full">
        <a href="{{ url_for('course_overview', course_slug=course['slug']) }}" class="nav-btn text-gray-400 hover:text-gray-900">
            <i data-lucide="x" class="h-5 w-5"></i>
        </a>
        
        <div class="flex items-center gap-3 flex-1 justify-center max-w-3xl">
            <button id="back-btn" class="nav-btn text-gray-900">
                <i data-lucide="arrow-left" class="h-6 w-6"></i>
            </button>
            
            <div class="flex-1 max-w-[400px]">
                <div class="h-3 w-full overflow-hidden rounded-full bg-gray-100">
                    <div id="progress-fill" class="h-full rounded-full bg-gradient-to-r from-green-500 to-green-300 transition-all duration-500 ease-out" style="width: 0%;"></div>
                </div>
            </div>

            <button id="next-btn" class="nav-btn text-gray-900" disabled>
                <i data-lucide="arrow-right" class="h-6 w-6"></i>
            </button>
        </div>

        <div class="flex shrink-0 items-center gap-1.5 font-extrabold text-gray-300 relative">
            <span class="text-lg tracking-tight text-gray-800" id="current-xp">{{ current_user['total_xp'] if current_user else 0 }}</span>
            <span id="xp-boost" class="xp-boost-number absolute right-full mr-4 whitespace-nowrap">+5</span>
            <i data-lucide="zap" class="h-5 w-5 text-yellow-400 fill-yellow-400"></i>
        </div>
    </header>

    <!-- The Whole Lesson Canvas -->
    <div id="lesson-canvas" class="flex-1 mx-8 mb-8 bg-white rounded-3xl border-2 border-gray-200 flex flex-col overflow-hidden transition-all duration-500">

        <!-- ─── Main Content Area ─── -->
        <main id="lesson-main" class="flex-1 overflow-y-auto px-12 py-8 flex flex-col items-center">
            <!-- Vertical Centering Wrapper: Centers content if short, starts at top if long -->
            <div class="my-auto w-full max-w-[640px]">
                <div id="slide-viewport" class="w-full">
                    {% block lesson_content %}{% endblock %}
                </div>
            </div>
        </main>

        {% set next_lesson = (lessons | selectattr("number", "equalto", lesson.number + 1) | first) %}

        <!-- ─── Footer ─── -->
        <footer class="flex-none bg-white py-5 px-6 flex justify-center z-50">
            <button id="continue-btn" data-state="continue">
            Continue
        </button>
            <form id="complete-form" action="{{ url_for('complete_lesson', course_slug=course.slug, lesson_number=lesson.number) }}" method="post" class="hidden"></form>
        </footer>

    </div> <!-- End Canvas Wrapper -->

    <script>
        const LESSON_CONFIG = {
            isGuest: {{ 'true' if not current_user else 'false' }},
            isCompleted: {{ 'true' if current_user and completed_lessons >= lesson["number"] else 'false' }},
            nextUrl: "{{ lesson_url(next_lesson, course['slug']) if next_lesson else url_for('course_overview', course_slug=course['slug']) }}",
            loginUrl: "{{ url_for('login', next=request.path) | safe }}",
            isLastLesson: {{ 'true' if not next_lesson else 'false' }}
        };

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
    <script src="{{ url_for('static', filename='js/xp_animation.js') }}"></script>
    
    <!-- Prism.js and Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
        window.copyToClipboard = function(btn) {
            const code = btn.getAttribute('data-code');
            const textSpan = btn.querySelector('.copy-text');
            const icon = btn.querySelector('i');

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(() => {
                    updateButton();
                });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    updateButton();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }

            function updateButton() {
                const originalText = textSpan ? textSpan.textContent : 'Copy';
                if (textSpan) textSpan.textContent = 'Copied!';
                btn.classList.add('text-green-500');
                
                if (window.lucide) {
                    const iconEl = btn.querySelector('[data-lucide]');
                    if (iconEl) {
                        iconEl.setAttribute('data-lucide', 'check');
                        lucide.createIcons();
                    }
                }

                setTimeout(() => {
                    if (textSpan) textSpan.textContent = originalText;
                    btn.classList.remove('text-green-500');
                    if (window.lucide) {
                        const iconEl = btn.querySelector('[data-lucide]');
                        if (iconEl) {
                            iconEl.setAttribute('data-lucide', 'copy');
                            lucide.createIcons();
                        }
                    }
                }, 2000);
            }
        };
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
