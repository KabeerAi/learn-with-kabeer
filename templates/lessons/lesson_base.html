<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }} - Learn with Kabeer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <style>
        /* Global Reset for Lesson View */
        html { scroll-behavior: smooth; font-feature-settings: "ss03", "cv11"; }
        ::selection { background: #111827; color: #FFFFFF; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 999px; }

        /* Slide animation */
        .slide-enter {
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* --- FORCED PRISM & CODE STYLES --- */
        /* Minimal Block Styling */
        pre[class*="language-"], 
        .lesson-block pre {
            margin: 0 !important;
            padding: 1.25rem !important;
            background: transparent !important;
            font-size: 0.85rem !important;
            border: none !important;
            border-radius: 0 !important;
            white-space: pre !important;
            word-break: normal !important;
            overflow: auto !important;
            line-height: 1.6 !important;
        }
        
        /* Block Code Text Color (Light for Dark Background) */
        pre[class*="language-"] code,
        .lesson-block pre code {
            color: #E6EDF3 !important;
        }

        /* --- UNIFIED KEYWORD STYLING (Inline Code) --- */
        /* This creates the w3schools style "block word" look for technical terms */
        :not(pre) > code {
            background-color: #F1F1F1 !important;
            color: #111827 !important;
            padding: 2px 8px !important;
            font-size: 0.85em !important;
            border-radius: 6px !important;
            border: 1px solid #E1E1E1 !important;
            font-weight: 700 !important;
            display: inline-block !important;
            line-height: 1.4 !important;
            vertical-align: middle !important;
            margin: 0 2px !important;
            box-shadow: 0 1px 0 0 rgba(0,0,0,0.05) !important;
            font-family: 'JetBrains Mono', monospace !important;
        }

        /* Standard Bold Styling */
        .prose strong,
        .lesson-block strong {
            font-weight: 700 !important;
            color: inherit !important;
        }

        /* Adjust Typography if used */
        .prose pre {
            background-color: #0D1117 !important;
            padding: 0 !important; /* Inner pre handles padding */
        }
        /* Removed .prose code override to allow universal keyword styling */
    </style>
</head>
<body class="h-screen overflow-hidden bg-white text-gray-900 font-sans antialiased flex flex-col">
    
    <!-- ─── Header ─── -->
    <header class="flex-none bg-white px-6 py-4 flex items-center justify-between z-50 w-full">
        <a href="{{ url_for('course_overview', course_slug=course['slug']) }}" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-gray-400 hover:bg-gray-100 hover:text-gray-900 transition-colors">
            <i data-lucide="x" class="h-5 w-5 stroke-[2.5]"></i>
        </a>
        <div class="flex-1 mx-6 lg:mx-16 max-w-xl">
            <div class="h-3 w-full overflow-hidden rounded-full bg-gray-100">
                <div id="progress-fill" class="h-full rounded-full bg-[#58CC02] transition-all duration-500 ease-out" style="width: 0%;"></div>
            </div>
        </div>
        <div class="flex shrink-0 items-center gap-1.5 font-extrabold text-gray-300">
            <span class="text-lg tracking-tight text-gray-800">{{ current_user['total_xp'] if current_user else 0 }}</span>
            <i data-lucide="zap" class="h-5 w-5 text-yellow-400 fill-yellow-400"></i>
        </div>
    </header>

    <!-- ─── Main: full height, centers content vertically ─── -->
    <main id="lesson-main" class="flex-1 overflow-y-auto px-6 py-12 flex flex-col items-center">
        <!-- Vertical Centering Wrapper: Centers content if short, starts at top if long -->
        <div class="my-auto w-full max-w-[640px]">
            <div id="slide-viewport" class="w-full">
                {% block lesson_content %}{% endblock %}
            </div>
        </div>
    </main>

    {% set next_lesson = (lessons | selectattr("number", "equalto", lesson.number + 1) | first) %}

    <!-- ─── Footer ─── -->
    <footer class="flex-none border-t border-gray-100 bg-white py-5 px-6 flex justify-center z-50">
        <button id="continue-btn" class="w-full max-w-[320px] rounded-full bg-[#2A2A2A] py-3.5 text-center text-[16px] font-bold tracking-wide text-white shadow-sm hover:bg-black active:translate-y-[2px] transition-all">
            Continue
        </button>
        <form id="complete-form" action="{{ url_for('complete_lesson', course_slug=course['slug'], lesson_number=lesson['number']) }}" method="post" class="hidden"></form>
    </footer>

    <script>
        const LESSON_CONFIG = {
            isGuest: {{ 'true' if not current_user else 'false' }},
            isCompleted: {{ 'true' if current_user and completed_lessons >= lesson["number"] else 'false' }},
            nextUrl: "{{ lesson_url(next_lesson, course['slug']) if next_lesson else url_for('course_overview', course_slug=course['slug']) }}",
            loginUrl: "{{ url_for('login', next=request.path) | safe }}",
            isLastLesson: {{ 'true' if not next_lesson else 'false' }}
        };

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        function checkLessonQuiz(btn, index, correctIndex) {
            const container = btn.closest('.quiz-container');
            const allBtns = container.querySelectorAll('.quiz-btn');
            allBtns.forEach(b => {
                b.classList.remove('border-gray-900', 'bg-gray-50', 'border-red-400', 'bg-red-50');
                b.classList.add('border-gray-200', 'bg-white');
                b.querySelector('.quiz-icon')?.classList.add('hidden');
                b.querySelector('.quiz-icon-error')?.classList.add('hidden');
                const c = b.querySelector('.quiz-circle');
                if (c) { c.classList.remove('border-gray-900', 'bg-gray-900', 'border-red-400', 'bg-red-400'); c.classList.add('border-gray-300'); }
            });
            const circle = btn.querySelector('.quiz-circle');
            btn.classList.remove('border-gray-200', 'bg-white');
            if (index === correctIndex) {
                btn.classList.add('border-gray-900', 'bg-gray-50');
                if (circle) { circle.classList.remove('border-gray-300'); circle.classList.add('border-gray-900', 'bg-gray-900'); }
                btn.querySelector('.quiz-icon')?.classList.remove('hidden');
            } else {
                btn.classList.add('border-red-400', 'bg-red-50');
                if (circle) { circle.classList.remove('border-gray-300'); circle.classList.add('border-red-400', 'bg-red-400'); }
                btn.querySelector('.quiz-icon-error')?.classList.remove('hidden');
            }
        }
    </script>
    <script src="{{ url_for('static', filename='js/xp_animation.js') }}"></script>
    
    <!-- Prism.js and Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
        window.copyToClipboard = function(btn) {
            const code = btn.getAttribute('data-code');
            const textSpan = btn.querySelector('.copy-text');
            const icon = btn.querySelector('i');

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(() => {
                    updateButton();
                });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    updateButton();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }

            function updateButton() {
                const originalText = textSpan ? textSpan.textContent : 'Copy';
                if (textSpan) textSpan.textContent = 'Copied!';
                btn.classList.add('text-green-500');
                
                if (window.lucide) {
                    const iconEl = btn.querySelector('[data-lucide]');
                    if (iconEl) {
                        iconEl.setAttribute('data-lucide', 'check');
                        lucide.createIcons();
                    }
                }

                setTimeout(() => {
                    if (textSpan) textSpan.textContent = originalText;
                    btn.classList.remove('text-green-500');
                    if (window.lucide) {
                        const iconEl = btn.querySelector('[data-lucide]');
                        if (iconEl) {
                            iconEl.setAttribute('data-lucide', 'copy');
                            lucide.createIcons();
                        }
                    }
                }, 2000);
            }
        };
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
