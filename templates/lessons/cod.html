{% extends "base.html" %}

{% block content %}
<main id="cod-container"
    class="state-initial relative flex h-[calc(100vh-64px)] flex-col overflow-hidden bg-[#F7F6F3] text-[#111111]">

    <!-- subtle grain -->
    <div class="pointer-events-none absolute inset-0 opacity-[0.018]"
        style="background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22 viewBox=%220 0 160 160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22 opacity=%220.28%22/%3E%3C/svg%3E');">
    </div>

    <!-- HEADER -->
    <header id="chat-header"
        class="pointer-events-none relative z-30 border-b border-black/[0.05] bg-[#F7F6F3]/90 opacity-0 backdrop-blur-xl transition-all duration-500">

        <div class="mx-auto flex h-16 max-w-[1180px] items-center justify-between px-6">

            <!-- brand -->
            <div class="flex items-center gap-3">

                <div
                    class="flex h-9 w-9 items-center justify-center rounded-xl border border-black/[0.06] bg-white shadow-[0_1px_2px_rgba(0,0,0,0.03)]">

                    <i data-lucide="sparkles" class="h-4 w-4 text-black"></i>
                </div>

                <h1 class="text-[15px] font-semibold tracking-[-0.04em] text-black">
                    Forge
                </h1>
            </div>

            <!-- right -->
            <div class="flex items-center gap-3">

                <div
                    class="flex items-center gap-2 rounded-xl border border-black/[0.06] bg-white px-3 py-2 shadow-[0_1px_2px_rgba(0,0,0,0.02)]">

                    <div class="h-1.5 w-1.5 rounded-full bg-black"></div>

                    <span class="text-[12px] font-medium tracking-[-0.02em] text-[#5A5A5A]">
                        {{ current_user['total_xp'] | comma }} XP
                    </span>
                </div>

                <button onclick="resetChat()"
                    class="flex h-9 w-9 items-center justify-center rounded-xl border border-black/[0.06] bg-white transition-all duration-200 hover:border-black hover:bg-black hover:text-white">

                    <i data-lucide="plus" class="h-4 w-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CHAT -->
    <div id="chatMessages"
        class="relative z-10 hidden flex-1 overflow-y-auto px-6 py-12 opacity-0 transition-opacity duration-500">

        <div class="mx-auto w-full max-w-3xl space-y-10">
            <!-- injected messages -->
        </div>

        <!-- THINKING -->
        <div id="statusIndicator" class="mt-8 hidden">

            <div class="mx-auto flex max-w-3xl items-center gap-3">

                <!-- silver shimmer -->
                <div class="thinking-orb relative overflow-hidden">

                    <div class="thinking-shine"></div>
                </div>

                <span id="statusText" class="thinking-text text-[13px] font-medium tracking-[-0.02em] text-[#6B6B6B]">

                    thinking
                </span>
            </div>
        </div>
    </div>

    <!-- HERO -->
    <section id="interaction-area"
        class="relative z-20 flex flex-1 flex-col items-center justify-center px-6 transition-all duration-500 ease-out">

        <!-- hero -->
        <div id="initial-content" class="w-full max-w-4xl text-center transition-all duration-500">

            <h1
                class="mx-auto max-w-4xl text-[58px] font-semibold leading-[0.94] tracking-[-0.08em] text-black sm:text-[84px]">

                Learn with
                <br>

                precision.
            </h1>

            <p class="mx-auto mt-8 max-w-xl text-[17px] font-medium leading-relaxed tracking-[-0.02em] text-[#6A6A6A]">

                Structured courses generated for serious learning.
            </p>
        </div>

        <!-- INPUT -->
        <div id="input-wrapper" class="relative mt-14 w-full max-w-[820px] transition-all duration-500">

            <!-- soft shadow plate -->
            <div class="absolute inset-0 translate-y-2 rounded-[30px] bg-black/[0.03] blur-2xl">
            </div>

            <form id="chatForm" class="relative">

                <div
                    class="group overflow-hidden rounded-[30px] border border-black/[0.07] bg-white transition-all duration-300 focus-within:border-black">

                    <!-- top gloss -->
                    <div
                        class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-black/10 to-transparent">
                    </div>

                    <!-- main -->
                    <div class="flex items-center gap-4 px-5 py-5">

                        <!-- icon -->
                        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-[#F1F0EC]">

                            <i data-lucide="search" class="h-4.5 w-4.5 text-black"></i>
                        </div>

                        <!-- input -->
                        <input type="text" id="userInput" autocomplete="off" placeholder="What do you want to master?"
                            class="w-full bg-transparent text-[17px] font-medium tracking-[-0.03em] text-black outline-none placeholder:text-[#9A9A9A]">

                        <!-- send -->
                        <button type="submit" id="sendBtn"
                            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-black text-white transition-all duration-200 hover:scale-[1.015] active:scale-[0.985] disabled:opacity-30">

                            <i data-lucide="arrow-up" class="h-4.5 w-4.5"></i>
                        </button>
                    </div>

                    <!-- suggestions -->
                    <div id="suggestions"
                        class="flex flex-wrap gap-2 border-t border-black/[0.05] px-5 py-4 transition-all duration-300">

                        <button onclick="useSuggestion(this)"
                            class="suggestion-chip rounded-full bg-[#F2F1ED] px-4 py-2 text-[13px] font-medium tracking-[-0.02em] text-[#5A5A5A] transition-all duration-200 hover:bg-black hover:text-white">

                            Operating Systems
                        </button>

                        <button onclick="useSuggestion(this)"
                            class="suggestion-chip rounded-full bg-[#F2F1ED] px-4 py-2 text-[13px] font-medium tracking-[-0.02em] text-[#5A5A5A] transition-all duration-200 hover:bg-black hover:text-white">

                            Neural Networks
                        </button>

                        <button onclick="useSuggestion(this)"
                            class="suggestion-chip rounded-full bg-[#F2F1ED] px-4 py-2 text-[13px] font-medium tracking-[-0.02em] text-[#5A5A5A] transition-all duration-200 hover:bg-black hover:text-white">

                            React Architecture
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <!-- SUCCESS -->
    <div id="successOverlay"
        class="pointer-events-none fixed inset-0 z-[60] flex flex-col items-center justify-center bg-[#F7F6F3] opacity-0 transition-opacity duration-700">

        <div
            class="mb-5 flex h-20 w-20 items-center justify-center rounded-[24px] border border-black/[0.07] bg-white shadow-[0_10px_30px_rgba(0,0,0,0.04)]">

            <i data-lucide="check" class="h-7 w-7 text-black"></i>
        </div>

        <h2 class="text-3xl font-semibold tracking-[-0.06em] text-black">
            Course Ready
        </h2>

        <p class="mt-2 text-[12px] font-medium tracking-[-0.02em] text-[#888888]">
            opening workspace
        </p>
    </div>
</main>

<style>
    /* ======================================================
   BASE
====================================================== */

    body {
        background: #F7F6F3;
    }

    /* ======================================================
   STATES
====================================================== */

    .state-chat #interaction-area {
        flex: none;
        justify-content: flex-end;
        padding-top: 1.5rem;
        padding-bottom: 2rem;
    }

    .state-chat #initial-content {
        opacity: 0;
        transform: translateY(-16px);
        pointer-events: none;
        height: 0;
        overflow: hidden;
    }

    .state-chat #chat-header {
        opacity: 1;
        pointer-events: auto;
    }

    .state-chat #chatMessages {
        display: block;
        opacity: 1;
    }

    .state-chat #input-wrapper {
        max-width: 760px;
    }

    /* remove suggestions after chat starts */
    .state-chat #suggestions {
        opacity: 0;
        height: 0;
        overflow: hidden;
        padding-top: 0;
        padding-bottom: 0;
        border-top-width: 0;
        pointer-events: none;
    }

    /* ======================================================
   CHAT TYPOGRAPHY
====================================================== */

    .chat-content {
        font-size: 15px;
        line-height: 1.9;
        color: #444444;
        font-weight: 500;
        letter-spacing: -0.01em;
    }

    .chat-content h1,
    .chat-content h2,
    .chat-content h3 {
        color: black;
        font-weight: 600;
        letter-spacing: -0.05em;
    }

    .chat-content h1 {
        font-size: 2rem;
        margin: 2rem 0 1rem;
    }

    .chat-content h2 {
        font-size: 1.35rem;
        margin: 1.7rem 0 1rem;
    }

    .chat-content h3 {
        font-size: 1.1rem;
        margin: 1.4rem 0 0.7rem;
    }

    .chat-content p {
        margin-bottom: 1.3rem;
    }

    .chat-content ul {
        list-style: none;
        padding-left: 0;
        margin-bottom: 1.3rem;
    }

    .chat-content ul li {
        position: relative;
        padding-left: 1.1rem;
        margin-bottom: 0.45rem;
    }

    .chat-content ul li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 11px;
        height: 4px;
        width: 4px;
        border-radius: 999px;
        background: black;
    }

    .chat-content code {
        border-radius: 6px;
        background: #F0EFEB;
        padding: 0.15rem 0.4rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.84em;
        color: #C92C5C;
    }

    .chat-content pre {
        overflow-x: auto;
        border-radius: 22px;
        background: #111111;
        padding: 1.4rem;
        color: white;
        font-size: 13px;
        line-height: 1.7;
    }

    .chat-content pre code {
        background: transparent;
        color: inherit;
        padding: 0;
    }

    .chat-content blockquote {
        margin: 1.8rem 0;
        border-left: 2px solid black;
        padding-left: 1rem;
        color: #666666;
    }

    /* ======================================================
   THINKING
====================================================== */

    .thinking-orb {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(145deg,
                #d9d9d9,
                #f4f4f4,
                #bdbdbd);
        box-shadow:
            inset 0 1px 1px rgba(255, 255, 255, 0.7),
            inset 0 -1px 2px rgba(0, 0, 0, 0.08),
            0 0 12px rgba(255, 255, 255, 0.5);
    }

    .thinking-shine {
        position: absolute;
        inset: -40%;
        background: linear-gradient(120deg,
                transparent 20%,
                rgba(255, 255, 255, 0.95) 50%,
                transparent 80%);
        animation: silverShine 2s linear infinite;
        transform: rotate(12deg);
    }

    @keyframes silverShine {
        from {
            transform: translateX(-180%) rotate(12deg);
        }

        to {
            transform: translateX(180%) rotate(12deg);
        }
    }

    .thinking-text {
        animation: thinkingFade 1.6s ease-in-out infinite;
    }

    @keyframes thinkingFade {

        0%,
        100% {
            opacity: 0.55;
        }

        50% {
            opacity: 1;
        }
    }

    /* ======================================================
   ANIMATION
====================================================== */

    .message-enter {
        animation: messageIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 2px;
        background: black;
        animation: blink 0.8s infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }

    /* ======================================================
   SCROLLBAR
====================================================== */

    #chatMessages::-webkit-scrollbar {
        width: 6px;
    }

    #chatMessages::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.08);
        border-radius: 999px;
    }

    #chatMessages::-webkit-scrollbar-track {
        background: transparent;
    }

    /* ======================================================
   CHIPS
====================================================== */

    .suggestion-chip {
        animation: chipIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
    }

    .suggestion-chip:nth-child(1) {
        animation-delay: 0.08s;
    }

    .suggestion-chip:nth-child(2) {
        animation-delay: 0.16s;
    }

    .suggestion-chip:nth-child(3) {
        animation-delay: 0.24s;
    }

    @keyframes chipIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cod.js') }}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
