<div class="canvas-item group/blk" id="${block.id}" data-type="callout">
    <div class="not-prose rounded-2xl border ${block.data.type === 'warning' ? 'border-amber-200 bg-amber-50' : 'border-sky-200 bg-sky-50'} p-6 flex gap-5">
        <div class="w-11 h-11 shrink-0 rounded-xl bg-white border border-inherit flex items-center justify-center shadow-sm">
            <i data-lucide="${block.data.type === 'warning' ? 'alert-triangle' : 'info'}" class="w-5 h-5 ${block.data.type === 'warning' ? 'text-amber-600' : 'text-sky-600'}"></i>
        </div>
        <div class="flex-1">
            <h4 contenteditable="true" onblur="updateBlockData('${block.id}', {title: this.innerText})" class="font-bold text-xs uppercase tracking-wider text-gray-900 mb-1 focus:outline-none">${block.data.title}</h4>
            <div contenteditable="true" onblur="updateBlockData('${block.id}', {body: this.innerText})" class="text-sm font-medium leading-relaxed text-gray-700 focus:outline-none">${block.data.body}</div>
        </div>
        <button onclick="toggleCalloutType('${block.id}')" class="w-8 h-8 rounded-lg hover:bg-white/50 transition-colors flex items-center justify-center text-gray-400"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
    </div>
    <div class="item-controls">
        <div class="control-btn drag-handle"><i data-lucide="grip-vertical" class="w-4 h-4"></i></div>
        <button class="control-btn" onclick="duplicateBlock('${block.id}')" title="Duplicate"><i data-lucide="copy" class="w-4 h-4"></i></button>
        <button class="control-btn delete" onclick="deleteBlock('${block.id}')" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
</div>
