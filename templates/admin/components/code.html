<div class="canvas-item group/blk" id="${block.id}" data-type="code">
    <div class="not-prose relative my-6 w-full rounded-xl border border-gray-800 bg-[#0A0A0A] text-left cursor-pointer group" onclick="openCodeModal('${block.id}')">
        <div class="flex items-center justify-between px-4 py-2 border-b border-gray-800/50 bg-[#0A0A0A] rounded-t-xl">
            <span class="text-xs font-mono text-gray-500">${block.data.lang || 'text'}</span>
            <i data-lucide="code" class="w-4 h-4 text-gray-500"></i>
        </div>
        <div class="w-full">
            <pre class="language-${block.data.lang || 'text'}"><code class="language-${block.data.lang || 'text'}">${escapeHtml(block.data.code)}</code></pre>
        </div>
    </div>
    <div class="item-controls">
        <div class="control-btn drag-handle"><i data-lucide="grip-vertical" class="w-4 h-4"></i></div>
        <button class="control-btn" onclick="duplicateBlock('${block.id}')" title="Duplicate"><i data-lucide="copy" class="w-4 h-4"></i></button>
        <button class="control-btn delete" onclick="deleteBlock('${block.id}')" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
</div>
