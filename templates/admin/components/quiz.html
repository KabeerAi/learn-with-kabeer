<div class="canvas-item group/blk" id="${block.id}" data-type="quiz">
    <div class="not-prose rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-6 h-6 rounded-lg bg-gray-900 flex items-center justify-center text-[10px] text-white font-bold">?</div>
            <h3 contenteditable="true" onblur="updateBlockData('${block.id}', {question: this.innerText})" class="text-base font-bold tracking-tight text-gray-900 focus:outline-none">${block.data.question}</h3>
        </div>
        <div class="space-y-3 mb-6">
            ${block.data.options.map((opt, i) => `
                <div class="flex items-center gap-3 group/opt">
                    <div class="w-5 h-5 shrink-0 rounded-full border border-gray-200 ${i === block.data.correct ? 'bg-gray-900 border-gray-900' : 'bg-white'} cursor-pointer transition-all hover:border-gray-400" onclick="setQuizCorrect('${block.id}', ${i})"></div>
                    <div contenteditable="true" onblur="updateQuizOption('${block.id}', ${i}, this.innerText)" class="flex-1 text-sm font-semibold text-gray-600 focus:outline-none">${opt}</div>
                    <button onclick="removeQuizOption('${block.id}', ${i})" class="opacity-0 group-hover/opt:opacity-100 text-gray-300 hover:text-red-500 transition-all"><i data-lucide="minus-circle" class="w-4 h-4"></i></button>
                </div>
            `).join('')}
        </div>
        <button onclick="addQuizOption('${block.id}')" class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-gray-900 transition-colors">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Choice
        </button>
    </div>
    <div class="item-controls">
        <div class="control-btn drag-handle"><i data-lucide="grip-vertical" class="w-4 h-4"></i></div>
        <button class="control-btn" onclick="duplicateBlock('${block.id}')" title="Duplicate"><i data-lucide="copy" class="w-4 h-4"></i></button>
        <button class="control-btn delete" onclick="deleteBlock('${block.id}')" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
</div>
