<div class="canvas-item group/blk" id="${block.id}" data-type="image">
    <div class="not-prose rounded-xl overflow-hidden ${block.data.url ? 'border border-gray-200' : 'border border-dashed border-gray-300 bg-gray-50'} cursor-pointer transition-colors hover:border-gray-400 w-full" onclick="openImageModal('${block.id}')">
        ${block.data.url ? 
            `<img src="${block.data.url}" class="w-full h-auto block object-cover">` : 
            `<div class="py-12 flex flex-col items-center justify-center gap-2">
                <i data-lucide="image" class="w-5 h-5 text-gray-400"></i>
                <span class="text-sm font-medium text-gray-500">Upload Image</span>
             </div>`
        }
    </div>
    <div class="item-controls">
        <div class="control-btn drag-handle"><i data-lucide="grip-vertical" class="w-4 h-4"></i></div>
        <button class="control-btn" onclick="duplicateBlock('${block.id}')" title="Duplicate"><i data-lucide="copy" class="w-4 h-4"></i></button>
        <button class="control-btn delete" onclick="deleteBlock('${block.id}')" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>
</div>
