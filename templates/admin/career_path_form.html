{% extends "base.html" %}

{% block content %}
<main class="flex-1 overflow-y-auto bg-[#FAF9F6]">
    <div class="mx-auto max-w-3xl px-5 py-10 sm:px-6 lg:px-8 lg:py-14">
        <header class="mb-10 border-b border-[#E5E5E5] pb-10">
            <div class="mb-4 flex items-center gap-2 text-xs font-semibold text-[#A3A3A3]">
                <a href="{{ url_for('admin_dashboard') }}" class="hover:text-[#1C1C1C] transition-colors">Admin Dashboard</a>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                <span class="text-[#1C1C1C]">{% if path %}Edit{% else %}New{% endif %} Career Path</span>
            </div>
            <h1 class="text-4xl font-semibold leading-tight tracking-tight text-[#1C1C1C]">
                {% if path %}Edit {{ path.title }}{% else %}Create New Career Path{% endif %}
            </h1>
        </header>

        <form method="post" class="rounded-xl border border-[#1C1C1C] bg-white p-6 sm:p-8 shadow-[-4px_4px_0_0_#1C1C1C]">
            <div class="grid gap-6 sm:grid-cols-2">
                <div class="sm:col-span-2">
                    <label for="title" class="mb-2 block text-sm font-medium text-[#1C1C1C]">Career Path Title</label>
                    <input type="text" id="title" name="title" required value="{{ path.title if path else '' }}" class="block w-full rounded-lg border border-[#E5E5E5] bg-[#FAF9F6] px-4 py-2.5 text-sm text-[#1C1C1C] focus:border-[#1C1C1C] focus:outline-none focus:ring-1 focus:ring-[#1C1C1C]">
                </div>

                <div class="sm:col-span-2">
                    <label for="subtitle" class="mb-2 block text-sm font-medium text-[#1C1C1C]">Subtitle (Short hook)</label>
                    <input type="text" id="subtitle" name="subtitle" required value="{{ path.subtitle if path else '' }}" class="block w-full rounded-lg border border-[#E5E5E5] bg-[#FAF9F6] px-4 py-2.5 text-sm text-[#1C1C1C] focus:border-[#1C1C1C] focus:outline-none focus:ring-1 focus:ring-[#1C1C1C]">
                </div>

                <div class="sm:col-span-2">
                    <label for="description" class="mb-2 block text-sm font-medium text-[#1C1C1C]">Description</label>
                    <textarea id="description" name="description" rows="4" class="block w-full rounded-lg border border-[#E5E5E5] bg-[#FAF9F6] px-4 py-2.5 text-sm text-[#1C1C1C] focus:border-[#1C1C1C] focus:outline-none focus:ring-1 focus:ring-[#1C1C1C]">{{ path.description if path else '' }}</textarea>
                </div>

                <div>
                    <label for="slug" class="mb-2 block text-sm font-medium text-[#1C1C1C]">URL Slug</label>
                    <input type="text" id="slug" name="slug" required value="{{ path.slug if path else '' }}" class="block w-full rounded-lg border border-[#E5E5E5] bg-[#FAF9F6] px-4 py-2.5 text-sm text-[#1C1C1C] focus:border-[#1C1C1C] focus:outline-none focus:ring-1 focus:ring-[#1C1C1C]">
                </div>

                <div>
                    <label for="level" class="mb-2 block text-sm font-medium text-[#1C1C1C]">Level</label>
                    <input type="text" id="level" name="level" required value="{{ path.level if path else 'Beginner Friendly' }}" class="block w-full rounded-lg border border-[#E5E5E5] bg-[#FAF9F6] px-4 py-2.5 text-sm text-[#1C1C1C] focus:border-[#1C1C1C] focus:outline-none focus:ring-1 focus:ring-[#1C1C1C]">
                </div>

                <div class="sm:col-span-2">
                    <label for="status" class="mb-2 block text-sm font-medium text-[#1C1C1C]">Status</label>
                    <select id="status" name="status" required class="block w-full rounded-lg border border-[#E5E5E5] bg-[#FAF9F6] px-4 py-2.5 text-sm text-[#1C1C1C] focus:border-[#1C1C1C] focus:outline-none focus:ring-1 focus:ring-[#1C1C1C]">
                        <option value="active" {% if path and path.status == 'active' %}selected{% endif %}>Active</option>
                        <option value="planned" {% if path and path.status == 'planned' %}selected{% endif %}>Planned (Coming Soon)</option>
                    </select>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 border-t border-[#E5E5E5] pt-6">
                <a href="{{ url_for('admin_dashboard') }}" class="inline-flex items-center justify-center rounded-lg border border-[#E5E5E5] px-5 py-2.5 text-sm font-semibold text-[#1C1C1C] transition-colors hover:bg-[#F5F5F5]">Cancel</a>
                <button type="submit" class="inline-flex items-center justify-center rounded-lg bg-[#1C1C1C] px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-black">
                    Save Career Path
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
