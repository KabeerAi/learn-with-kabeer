<div class="w-full text-left mb-8">
    <div class="text-base text-gray-900 mb-6 max-w-[500px] mx-auto">{{ block.data.question | markdown | safe }}</div>
    <div class="flex flex-col gap-4 max-w-[500px] mx-auto" id="quiz-options-{{ block.id if block.id else 'default' }}">
        {% for opt in block.data.options %}
        <button type="button" class="quiz-option w-full text-left px-6 py-4 rounded-xl border-2 border-gray-200 bg-white text-lg text-gray-900 transition-all duration-200 hover:border-gray-400 hover:bg-gray-50 hover:translate-x-1 focus:outline-none focus:ring-2 focus:ring-gray-200" data-index="{{ loop.index0 }}" data-correct="{{ 'true' if loop.index0 == block.data.correct else 'false' }}">
            {{ opt | markdown | safe }}
        </button>
        {% endfor %}
    </div>
    <div class="text-center mt-6 hidden" id="quiz-feedback-{{ block.id if block.id else 'default' }}">
        <p class="text-lg font-semibold" id="quiz-feedback-text-{{ block.id if block.id else 'default' }}"></p>
    </div>
</div>
