<div class="relative overflow-hidden rounded-xl border border-gray-800 bg-[#0D1117] shadow-xl my-10 not-prose group">
    <div class="flex items-center justify-between border-b border-gray-800 bg-black/20 px-5 py-3.5">
        <div class="flex items-center gap-4">
            <span class="text-[11px] font-bold uppercase tracking-widest text-gray-500 font-mono">{{ block.data.lang or 'text' }}</span>
        </div>
        <button onclick="copyToClipboard(this)" data-code="{{ block.data.code | e }}" class="flex items-center gap-2 rounded-md bg-gray-800 px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-gray-400 transition-all hover:bg-gray-700 hover:text-white">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span class="copy-text">Copy</span>
        </button>
    </div>
    <div class="overflow-x-auto">
        <pre class="language-{{ block.data.lang or 'text' }}"><code class="language-{{ block.data.lang or 'text' }}">{{ block.data.code | e }}</code></pre>
    </div>
</div>
